name: Publish student presentations (without notes)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "presentations/2026-11-19/**"
      - "presentations/2026-11-21/**"
      - "scripts/prepare_student_slides.py"
      - ".github/workflows/publish-student-slides.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "student-slides-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Prepare notes-free student sources
        run: |
          python scripts/prepare_student_slides.py \
            presentations/2026-11-19/index.qmd \
            presentations/2026-11-19/student-public.qmd
          python presentations/2026-11-21/prepare_student.py \
            presentations/2026-11-21/index.qmd \
            presentations/2026-11-21/student-public.qmd

      - name: Render self-contained presentations
        run: |
          # Render each deck from its own directory so Quarto finds its CSS.
          (
            cd presentations/2026-11-19
            quarto render student-public.qmd \
              --to revealjs --output index.html -M embed-resources:true
          )
          (
            cd presentations/2026-11-21
            quarto render student-public.qmd \
              --to revealjs --output index.html -M embed-resources:true
          )
          # The Friday address remains unchanged; Saturday gets its own path.
          mkdir -p public/2026-11-21
          cp presentations/2026-11-19/index.html public/index.html
          cp presentations/2026-11-21/index.html public/2026-11-21/index.html
          touch public/.nojekyll

      - name: Check that public presentations exclude speaker notes
        run: |
          python - <<'PY'
          from pathlib import Path

          decks = {
              Path("public/index.html"): 9,
              Path("public/2026-11-21/index.html"): 7,
          }
          for path, slides in decks.items():
              html = path.read_text(encoding="utf-8")
              if len(html) < 1000:
                  raise SystemExit(f"Suspiciously small render: {path}")
              for forbidden in (
                  'aside class="notes"',
                  'aside class="speaker-notes"',
                  "I have done some work with biologists",
                  "Do not disclose the Gaussian",
                  "The notebook imports two independent samples",
                  "return 2 + 3*x",
                  "return 2 + 3 * x",
              ):
                  if forbidden in html:
                      raise SystemExit(f"Private presenter material in {path}: {forbidden}")
              print(f"Checked notes-free HTML: {path} ({slides} source slides)")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
