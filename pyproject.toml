[project]
name = "math4sdg-industrial-mathematics-2026"
version = "0.1.0"
description = "Python resources for the UDSM MATH4SDG industrial mathematics workshop"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "jupyterlab>=4.3,<5",
  "ipykernel>=6,<8",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4",
  "scipy>=1.13,<2",
  "scikit-learn>=1.6,<2",
  "statsmodels>=0.14,<1",
  "meteostat>=2.1.4,<3",
]

# uv sync installs the project in editable mode, together with all runtime tools.
# The existing helpers are packaged without renaming their stable "tools" imports.
[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tools"
module-root = ""

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
